<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2a1d" />
  <title>Spieleabend – Handy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/play/play.css" />
  <link rel="stylesheet" href="/play/risiko.css" />
  <link rel="stylesheet" href="/shared/poker-karten.css" />
  <link rel="stylesheet" href="/play/poker.css" />
  <link rel="stylesheet" href="/shared/lobby.css" />
  <link rel="stylesheet" href="/shared/endstand.css" />
</head>
<body class="play-page">
  <!-- ============ BEITRETEN ============ -->
  <section id="join" class="join-screen lb-theme hidden">
    <div id="join-bg" class="lb-bg" aria-hidden="true"></div>
    <div class="jn-wrap">
      <header class="jn-head">
        <p class="lb-eyebrow lb-in" style="--i: 0">Spiel beitreten</p>
        <h1 class="lb-mark" id="jn-mark">Spieleabend</h1>
        <p id="join-game" class="jn-game lb-in" style="--i: 2"></p>
      </header>
      <div class="jn-card lb-glass lb-in" style="--i: 3">
        <form id="join-form" class="jn-form" autocomplete="off">
          <label class="jn-field"><span class="lb-label">Raumcode</span>
            <input id="join-code" class="jn-code" name="code" maxlength="4" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD" required />
          </label>
          <label class="jn-field"><span class="lb-label">Dein Name</span>
            <input id="join-name" name="name" maxlength="16" placeholder="z. B. Anna" required />
          </label>
          <fieldset id="join-figure-set" class="jn-field hidden">
            <legend class="lb-label">Spielfigur</legend>
            <div id="join-figures" class="pick-grid"></div>
          </fieldset>
          <fieldset class="jn-field">
            <legend class="lb-label">Farbe</legend>
            <div id="join-colors" class="pick-grid colors"></div>
          </fieldset>
          <div id="join-rejoin" class="rejoin hidden"></div>
          <button class="jn-submit" type="submit" id="btn-join">Beitreten</button>
          <p id="join-msg" class="jn-msg" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>

  <!-- ============ WARTEN / SPIEL ============ -->
  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="me">
        <span id="me-fig" class="me-fig"></span>
        <div>
          <div id="me-name" class="me-name"></div>
          <div class="me-money-wrap"><span id="me-money" class="money me-money"></span></div>
        </div>
      </div>
      <div class="turn">
        <div class="turn-label">Am Zug</div>
        <div id="turn-name" class="turn-name">–</div>
      </div>
    </header>

    <main id="main" class="main">
      <div id="panel-wait" class="panel"></div>
      <div id="panel-turn" class="panel hidden"></div>
      <div id="panel-props" class="panel hidden"></div>
      <div id="panel-trade" class="panel hidden"></div>
      <div id="panel-mini" class="panel hidden"></div>
      <div id="panel-risiko" class="panel hidden"></div>
      <div id="panel-poker" class="panel hidden"></div>
      <div id="panel-final" class="panel hidden"></div>
    </main>

    <nav id="tabs" class="tabs hidden">
      <button data-tab="turn" class="active">🎲<span>Zug</span></button>
      <button data-tab="props">🏠<span>Besitz</span></button>
      <button data-tab="trade">🤝<span>Handel</span><i class="badge hidden" id="trade-badge"></i></button>
      <button data-tab="mini" disabled>🎰<span>Minispiel</span></button>
    </nav>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/common.js"></script>
  <script src="/shared/lobby.js"></script>
  <script src="/shared/endstand.js"></script>
  <script src="/play/play.js"></script>
  <script src="/risiko/map-paths.js"></script>
  <script src="/shared/risiko-farben.js"></script>
  <script src="/play/risiko.js"></script>
  <script src="/shared/poker-karten.js"></script>
  <script src="/play/poker.js"></script>
</body>
</html>
