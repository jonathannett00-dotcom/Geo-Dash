<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monopoly-Abend – Spielfeld</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/shared/base.css" />
  <link rel="stylesheet" href="/shared/racetrack.css" />
  <link rel="stylesheet" href="/board/board.css" />
  <link rel="stylesheet" href="/board/risiko.css" />
</head>
<body class="board-page">
  <!-- ============ LOBBY ============ -->
  <section id="lobby" class="lobby hidden">
    <div class="lobby-card">
      <h1>🎲 Monopoly-Abend</h1>
      <p class="sub">Scannt den Code mit dem Handy, um mitzuspielen.</p>
      <div class="lobby-grid">
        <div class="join">
          <img id="qr" class="qr" alt="QR-Code zum Beitreten" width="220" height="220" />
          <div class="code-label">Raum-Code</div>
          <div id="room-code" class="room-code">····</div>
          <div id="join-url" class="join-url"></div>
        </div>
        <div class="lobby-side">
          <h2>Spieler <span id="lobby-count" class="count"></span></h2>
          <ul id="lobby-players" class="lobby-players"></ul>
          <div class="game-choice" id="game-choice" role="group" aria-label="Spiel auswählen"></div>
          <div id="settings-monopoly">
            <label class="start-money">Startbetrag für alle
              <span class="money-input"><input id="start-money" type="number" min="100" max="100000" step="50" value="1500" /><b>M</b></span>
            </label>
          </div>
          <div id="settings-risiko" class="risiko-settings hidden">
            <label>Kartentausch
              <select id="risiko-cardValues">
                <option value="steigend">steigend (4, 6, 8, 10, 12, 15, …)</option>
                <option value="fest">fest (4 / 6 / 8 / 10)</option>
              </select>
            </label>
            <label>Verschieben
              <select id="risiko-fortify">
                <option value="benachbart">ins Nachbargebiet</option>
                <option value="verbunden">über eigene Gebiete</option>
              </select>
            </label>
            <label>Animationen
              <select id="risiko-animation">
                <option value="normal">normal</option>
                <option value="kurz">kurz</option>
                <option value="aus">aus</option>
              </select>
            </label>
          </div>
          <button id="btn-start" class="btn primary big" disabled>Spiel starten</button>
          <p id="lobby-hint" class="hint"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ SPIEL ============ -->
  <section id="game" class="game hidden">
    <div class="board-wrap">
      <div id="board" class="board">
        <div id="center" class="center">
          <div id="center-main" class="center-main"></div>
          <div id="card-pop" class="card-pop hidden"></div>
        </div>
        <div id="tokens" class="tokens"></div>
      </div>
    </div>
    <aside class="sidebar">
      <div class="side-head">
        <span class="brand">🎲 Monopoly-Abend</span>
        <span>Raum <b id="side-code"></b></span>
      </div>
      <div id="side-players" class="side-players"></div>
    </aside>
    <!-- Minispiele laufen im Vollbild über Brett und Leiste -->
    <div id="stage" class="stage hidden"></div>
  </section>

  <!-- ============ RISIKO ============ -->
  <section id="risiko" class="risiko hidden">
    <svg id="rk-map" class="rk-map" role="img" aria-label="Risiko-Weltkarte"></svg>
    <header class="rk-panel rk-top">
      <div id="rk-banner" class="rk-banner"></div>
      <div id="rk-sound" class="rk-sound"></div>
      <div class="rk-room">Raum <b id="rk-code"></b></div>
    </header>
    <div id="rk-announce" class="rk-announce hidden" aria-live="polite"></div>
    <div id="rk-final" class="rk-final hidden"></div>
    <footer class="rk-bottom">
      <div id="rk-players" class="rk-panel rk-players"></div>
      <div class="rk-panel rk-feed">
        <div id="rk-battle" class="rk-battle hidden"></div>
        <ol id="rk-log" class="rk-log"></ol>
      </div>
    </footer>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/common.js"></script>
  <script src="/shared/racetrack.js"></script>
  <script src="/board/board.js"></script>
  <script src="/risiko/map-paths.js"></script>
  <script src="/shared/risiko-farben.js"></script>
  <script src="/board/risiko-audio.js"></script>
  <script src="/board/risiko.js"></script>
</body>
</html>
