# Render-Blueprint für den kostenlosen Plan (Dashboard → New → Blueprint).
services:
  - type: web
    name: monopoly-abend
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Verbindungs-URL von Neon – wird im Render-Dashboard eingetragen, nie im Repo
      - key: DATABASE_URL
        sync: false
